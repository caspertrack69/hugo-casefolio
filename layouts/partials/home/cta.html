{{- $cta := .Site.Params.contactCTA -}}
{{- with $cta.headline -}}
<section class="section section--divider" id="contact">
  <div class="container">
    <div class="cta">
      <h2 class="cta__headline">{{ $cta.headline }}</h2>
      {{- with $cta.intro }}<p class="cta__intro">{{ . }}</p>{{ end }}
      <div class="cta__actions">
        {{- with $cta.primaryLabel }}
        <a class="btn btn--primary" href="{{ $cta.primaryURL | default "#" }}">{{ . }}</a>
        {{- end }}
        {{- with $cta.secondaryLabel }}
        <a class="btn--link" href="{{ $cta.secondaryURL | default "#" }}">{{ . }}{{ partial "icon.html" (dict "name" "arrow-right") }}</a>
        {{- end }}
      </div>
    </div>
  </div>
</section>
{{- end -}}
