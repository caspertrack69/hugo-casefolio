name: Build example site

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.168.0'
          extended: true

      - name: Build example site
        working-directory: exampleSite
        run: hugo --themesDir ../.. --gc --minify

      - name: Verify output
        run: |
          test -f exampleSite/public/index.html
          test -f exampleSite/public/sitemap.xml
          test -f exampleSite/public/index.xml
